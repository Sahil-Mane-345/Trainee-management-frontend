<div id="form-input">
    <label [for]="id" class="form-label" >
        {{ inputLabel }}
    </label>

    <select [id]="id" [formControl]="inputControl" class="form-select" [attr.aria-invalid]="shouldShowErrors ? 'true' : 'false'" [attr.aria-describedby]="shouldShowErrors ? errorId : null" >
        <option value="" disabled> {{ placeholder }} </option>

        @for (option of options; track option.value) {
            <option [value]="option.value">
            {{ option.label }}
            </option>
        }

    </select>

    @if (shouldShowErrors) {
    <app-error-message [id]="errorId" [messages]="activeErrorMessages"/>
    }
</div>
