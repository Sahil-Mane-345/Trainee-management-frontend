<app-header [toggleState]="showSidebar" (toggleSidebar)="toggleSidebar()"></app-header>
<main>
    @if (showSidebar) {
        <div class="sidebar-backdrop" aria-hidden="true" (click)="closeSidebar()"></div>
    }
    <app-sidebar [sidebarState]="showSidebar" (closeSidebar)="closeSidebar()" ></app-sidebar>
    <div class="page-content">
        <router-outlet></router-outlet>
    </div>
</main>
